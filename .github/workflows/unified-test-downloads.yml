name: Publish reviewed decline notice TEST downloads
on:
  push:
    branches: ['feat/unified-test-downloads-87d1be8']
    paths: ['.github/workflows/unified-test-downloads.yml']
permissions:
  contents: write
jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '87d1be8848d5d2f91434d1c0b6691b87b399479d'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact reviewed source
        run: python3 tools/build-unified-release.py --commit 87d1be8848d5d2f91434d1c0b6691b87b399479d --output "$RUNNER_TEMP/unified-test-downloads"
      - name: Verify, wait for exact-source CI and publish TEST downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json, hashlib, urllib.request, urllib.parse, urllib.error, base64, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'unified-test-downloads'
          expected = {'unified-test-87d1be8848d5.tar.gz': '35a2274c90231413635e87f7b01d4898f7d0ee118da5a430c75be643f3bf7234', 'install-unified.py': '923d38b4781d93541c321a281ca2ccbd34b55f02d11313fb3edace0e1268ec9c', 'install-appointment-approval-host.py': 'b37ec08f3d3842bd0c43d392757bfa8743161a18044967239ad4d42aa8d1ebcb', 'HOST_TEST_REVIEW.md': 'b3778fbc1bbccdbd55670899dde6d890d9473a5298158dc3116ea889102261f3'}
          commit = '87d1be8848d5d2f91434d1c0b6691b87b399479d'
          tag = 'unified-test-87d1be8848d5'
          base = 'https://api.github.com/repos/SiteSeeAI/SiteSee-Real-Estate-Web-App'
          (root / 'HOST_TEST_REVIEW.md').write_bytes(base64.b64decode(''))
          (root / 'install-appointment-approval-host.py').write_bytes(pathlib.Path('tools/install-appointment-approval-host.py').read_bytes())
          files = [root / name for name in expected]
          for path in files:
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[path.name], path.name + ' checksum differs'
          (root / 'DOWNLOADS_SHA256SUMS.txt').write_text(''.join(expected[p.name] + '  ' + p.name + '\n' for p in files))
          files.append(root / 'DOWNLOADS_SHA256SUMS.txt')
          def api(url, method='GET', obj=None, data=None, content_type='application/json'):
              if obj is not None: data = json.dumps(obj).encode()
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': content_type, 'User-Agent': 'SiteSee-reviewed-TEST-downloads', 'X-GitHub-Api-Version': '2022-11-28'}
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
          for attempt in range(90):
              runs = api(base + '/actions/runs?branch=feat/unified-server-app-20261007&per_page=100')['workflow_runs']
              selected = {r['name']: r for r in runs if r['head_sha'] == commit}
              required = ['Unified Release Checks', 'Server Form CI', 'Customer Portal Checks']
              if all(name in selected and selected[name]['status'] == 'completed' for name in required):
                  assert all(selected[name]['conclusion'] == 'success' for name in required), 'Exact-source CI did not pass'
                  break
              time.sleep(10)
          else: raise RuntimeError('Exact-source CI not complete; no download publication')
          try:
              release = api(base + '/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api(base + '/releases', 'POST', obj={'tag_name': tag, 'target_commitish': commit, 'name': 'TEST customer decline notice correction ' + commit[:12], 'body': 'Plain customer decline notices with durable recovery. Exact source and installer recovery CI verified. Stripe TEST; operator installation and actual inbox acceptance remain separate.', 'draft': True, 'prerelease': True, 'make_latest': 'false'})
          release_url = base + '/releases/' + str(release['id'])
          assert release['tag_name'] == tag and release['target_commitish'] == commit and release['prerelease'] is True
          assets = {a['name']: a for a in release['assets']}
          assert set(assets).issubset(set(p.name for p in files)), 'Unknown assets preserved'
          for path in files:
              data = path.read_bytes(); digest = hashlib.sha256(data).hexdigest()
              asset = assets.get(path.name)
              if asset is None:
                  assert release['draft'] is True, 'Do not add files to an already published candidate'
                  url = release['upload_url'].split('{', 1)[0] + '?' + urllib.parse.urlencode({'name': path.name})
                  asset = api(url, 'POST', data=data, content_type='application/octet-stream')
              assert asset['state'] == 'uploaded' and asset['size'] == len(data)
              assert asset.get('digest') == 'sha256:' + digest
              print(path.name + ': exact SHA256 verified and uploaded')
          release = api(release_url)
          assert set(a['name'] for a in release['assets']) == set(p.name for p in files)
          if release['draft']:
              release = api(release_url, 'PATCH', obj={'draft': False, 'prerelease': True, 'make_latest': 'false'})
          assert release['draft'] is False and release['prerelease'] is True
          print('Published reviewed TEST downloads: ' + release['html_url'])
          PY
