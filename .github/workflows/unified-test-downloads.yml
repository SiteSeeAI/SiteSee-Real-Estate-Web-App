name: Publish reviewed UX-002 TEST downloads
on:
  push:
    branches: ['feat/unified-test-downloads-201b188']
    paths: ['.github/workflows/unified-test-downloads.yml']
permissions:
  contents: write
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: '201b1888abad434d37236e3f478b3e0b2068919b'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, pcntl
      - name: Validate private account primitives
        run: |
          find _private/server -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l _private/views/portal.php
          php -l _private/views/application-shell.php
          php tests/application-bootstrap.test.php
          php tests/application-shell.test.php
          php -l _private/views/portal-purchase.php
          php -l _private/views/portal-service.php
          php -l _private/views/portal-job.php
          php -l public/staff-production.php
          php -l _private/server/booking-webhook.php
          php -l public/account.php
          php -d sendmail_path=/bin/false tests/portal-email.test.php
          php tests/portal-email-concurrency.test.php
          php tests/portal-access.test.php
          php tests/portal-session.test.php
          php tests/portal-purchase.test.php
          php tests/portal-service.test.php
          php tests/account-workflow.test.php
          php tests/booking-change-request.test.php
          php tests/booking-review-ui.test.php
          php tests/portal-job.test.php
          php tests/booking-finance.test.php
          php tests/portal-onsite-catalog.test.php
          php tests/portal-vendor.test.php
          php -l public/vendor.php
          php -l public/staff-vendors.php
          php tests/portal-draft-recovery.test.php
          PORTAL_FIXTURE_AGENT_EMAIL=info@1789media.com php tests/portal-draft-recovery.test.php
          php tests/portal-test-recipient.test.php
          php tests/portal-release.test.php
          php tests/portal-phone.test.php
          php tests/portal-sms.test.php
          php -l tools/portal-enroll-phone.php
          python3 tests/portal-installer.test.py
          python3 tests/portal-complete.test.py
          python3 tests/portal-re-enrollment.test.py
          python3 tests/portal-re-workflow.test.py
          python3 tests/portal-draft-installer.test.py
          python3 tests/portal-polish-installer.test.py
          python3 tests/portal-email-installer.test.py
          python3 tests/portal-test-recipient-installer.test.py
          python3 tests/portal-job-installer.test.py
          python3 tests/portal-onsite-installer.test.py
          python3 tests/portal-vendor-installer.test.py
          python3 tests/portal-staff-installer.test.py
          python3 tests/portal-staff-source.test.py
          python3 tests/ux-workspace-source.test.py
          python3 tests/finance-source.test.py
          python3 tests/readiness-source.test.py
          python3 tools/build-portal-installer.py
          git diff --exit-code -- tools/install-customer-portal.py
          python3 tools/build-portal-complete.py
          git diff --exit-code -- tools/install-portal-complete.py
          python3 tools/build-re-draft-recovery.py
          git diff --exit-code -- tools/install-re-draft-recovery-r1.py
          python3 tools/build-re-business-workflow.py
          git diff --exit-code -- tools/install-re-business-workflow.py
          python3 tools/build-portal-polish.py
          git diff --exit-code -- tools/install-re-portal-polish-20261002-r1.py
          python3 tools/build-test-recipient.py
          git diff --exit-code -- tools/install-re-test-recipient-20261002-r1.py
          python3 tools/build-vendor-accounts.py
          git diff --exit-code -- tools/install-re-vendor-accounts-20261005-r1.py
          python3 tools/build-onsite-services.py
          git diff --exit-code -- tools/install-re-onsite-services-20261005-r1.py
          python3 tools/build-job-closeout.py
          git diff --exit-code -- tools/install-re-job-closeout-20261003-r1_1.py
          python3 tools/build-portal-email.py
          git diff --exit-code -- tools/install-re-email-change-20261002-r1.py
          python3 tools/build-staff-review.py
          git diff --exit-code -- tools/install-re-staff-review-20261002-r1.py
      - name: Use official HTTPS Ubuntu mirror for browser dependencies
        run: |
          # Preserve apt signatures and TLS while avoiding the previously stalled HTTP mirror.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-browser" --no-save playwright@1.58.2
          "$RUNNER_TEMP/portal-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Check preview interactions and responsive layout
        env:
          NODE_PATH: ${{ runner.temp }}/portal-browser/node_modules
          PORTAL_SCREENSHOTS: ${{ runner.temp }}/portal-screenshots
        run: |
          mkdir -p "$PORTAL_SCREENSHOTS"
          node tests/portal-preview.browser.cjs
          node tests/portal-http.browser.cjs
          node tests/portal-staff.browser.cjs
          node tests/portal-job.browser.cjs
          node tests/portal-vendor.browser.cjs
          node tests/portal-email.browser.cjs
          node tests/calendar-notice.browser.cjs
      - name: Save example-only preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-portal-preview
          path: ${{ runner.temp }}/portal-screenshots
          if-no-files-found: ignore
          retention-days: 7
  fpm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: '201b1888abad434d37236e3f478b3e0b2068919b'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, openssl, opcache
      - name: Install the matching FPM runtime for isolated tests
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y php8.2-fpm
      - name: Test protocol diagnostics and maintenance boundaries
        run: python3 tests/appointment-approval-host.test.py
      - name: Prove document-root behavior, token guard and code/cache refresh on actual FPM
        env:
          SITESEE_TEST_FPM: /usr/sbin/php-fpm8.2
          SITESEE_TEST_OPCACHE: /usr/lib/php/20220829/opcache.so
        run: python3 tests/appointment-approval-fpm.test.py
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: '201b1888abad434d37236e3f478b3e0b2068919b'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, curl, openssl
      - name: Require exact-source privileged release and interrupted replacement checks
        run: sudo env PATH="$PATH" SITESEE_REQUIRE_PRIVILEGED_TESTS=1 python3 tests/unified-release.test.py
  downloads:
    needs: [portal, fpm, release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '201b1888abad434d37236e3f478b3e0b2068919b'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact reviewed source
        run: python3 tools/build-unified-release.py --commit 201b1888abad434d37236e3f478b3e0b2068919b --output "$RUNNER_TEMP/unified-test-downloads"
      - name: Verify, wait for exact-source CI and publish TEST downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json, hashlib, urllib.request, urllib.parse, urllib.error, base64, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'unified-test-downloads'
          expected = {'unified-test-201b1888abad.tar.gz': 'f7c94d3d65d206d98e08cf545a30996baffd4c27f133ce8e1b119d1a052d6285', 'install-unified.py': '2df3fd62449d9827b9047cd8102a85e97ae9ac8cd09f45194169946664263657', 'install-appointment-approval-host.py': 'c6da86e9ecff3b57e126813a47f5ef1f698840e243022a5065a8f587eeb21d35', 'HOST_TEST_REVIEW.md': '7064f504ce1a4d97772a6e5ea7cf1f025596643a53e08ba5b40d47a48d25c6f3'}
          commit = '201b1888abad434d37236e3f478b3e0b2068919b'
          tag = 'unified-test-201b1888abad'
          base = 'https://api.github.com/repos/SiteSeeAI/SiteSee-Real-Estate-Web-App'
          (root / 'HOST_TEST_REVIEW.md').write_bytes(base64.b64decode(''))
          (root / 'install-appointment-approval-host.py').write_bytes(pathlib.Path('tools/install-appointment-approval-host.py').read_bytes())
          files = [root / name for name in expected]
          for path in files:
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[path.name], path.name + ' checksum differs'
          (root / 'DOWNLOADS_SHA256SUMS.txt').write_text(''.join(expected[p.name] + '  ' + p.name + '\n' for p in files))
          files.append(root / 'DOWNLOADS_SHA256SUMS.txt')
          def api(url, method='GET', obj=None, data=None, content_type='application/json'):
              if obj is not None: data = json.dumps(obj).encode()
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': content_type, 'User-Agent': 'SiteSee-reviewed-TEST-downloads', 'X-GitHub-Api-Version': '2022-11-28'}
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
          for attempt in range(90):
              runs = api(base + '/actions/runs?branch=feat/unified-server-app-20261007&per_page=100')['workflow_runs']
              selected = {r['name']: r for r in runs if r['head_sha'] == commit}
              required = ['Customer Portal Checks', 'Server Form CI']
              if all(name in selected and selected[name]['status'] == 'completed' for name in required):
                  assert all(selected[name]['conclusion'] == 'success' for name in required), 'Exact-source CI did not pass'
                  break
              time.sleep(10)
          else: raise RuntimeError('Exact-source CI not complete; no download publication')
          try:
              release = api(base + '/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api(base + '/releases', 'POST', obj={'tag_name': tag, 'target_commitish': commit, 'name': 'TEST UX-002 CRM readiness handoff ' + commit[:12], 'body': 'Fix required CRM contact verification after a successful readiness check. Same-document action choices preserve returned candidates and reports; fresh consent and separate calendar confirmation retained. Cache-versioned script delivery. Exactly two presentation payloads change; financial, provider and authorization behavior preserved. Exact source, ownership and interrupted installer CI verified. Stripe TEST; operator installation and connected acceptance remain separate.', 'draft': True, 'prerelease': True, 'make_latest': 'false'})
          release_url = base + '/releases/' + str(release['id'])
          assert release['tag_name'] == tag and release['target_commitish'] == commit and release['prerelease'] is True
          assets = {a['name']: a for a in release['assets']}
          assert set(assets).issubset(set(p.name for p in files)), 'Unknown assets preserved'
          for path in files:
              data = path.read_bytes(); digest = hashlib.sha256(data).hexdigest()
              asset = assets.get(path.name)
              if asset is None:
                  assert release['draft'] is True, 'Do not add files to an already published candidate'
                  url = release['upload_url'].split('{', 1)[0] + '?' + urllib.parse.urlencode({'name': path.name})
                  asset = api(url, 'POST', data=data, content_type='application/octet-stream')
              assert asset['state'] == 'uploaded' and asset['size'] == len(data)
              assert asset.get('digest') == 'sha256:' + digest
              print(path.name + ': exact SHA256 verified and uploaded')
          release = api(release_url)
          assert set(a['name'] for a in release['assets']) == set(p.name for p in files)
          if release['draft']:
              release = api(release_url, 'PATCH', obj={'draft': False, 'prerelease': True, 'make_latest': 'false'})
          assert release['draft'] is False and release['prerelease'] is True
          print('Published reviewed TEST downloads: ' + release['html_url'])
          PY
