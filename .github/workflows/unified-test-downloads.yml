name: Publish reviewed TEST downloads
on:
  push:
    branches: ['feat/unified-test-downloads-d380d41']
    paths: ['.github/workflows/unified-test-downloads.yml']
permissions:
  contents: write
jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d380d41a090342d82255906f73fad518d722020d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact reviewed candidate
        shell: bash
        run: |
          python3 tools/build-unified-release.py --commit d380d41a090342d82255906f73fad518d722020d --output "$RUNNER_TEMP/unified-test-downloads"
          git show 65a3ef6f93cf0a18067be2de558bb9a8c02d41a9:documents/unified/HOST_TEST_REVIEW.md > "$RUNNER_TEMP/unified-test-downloads/HOST_TEST_REVIEW.md"
      - name: Verify exact bytes, upload assets and publish TEST prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, json, hashlib, urllib.request, urllib.parse
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'unified-test-downloads'
          expected = {
              'unified-test-d380d41a0903.tar.gz': '3a33d161bcd2ed96485bb23b6560eef63df6a5c844a33313dfb1b475c4fd83ae',
              'install-unified.py': 'ef9442311d50a44f4b3b7352550fee0fe9c81b68cf2c9d1dd44642cdda7a2503',
          }
          files = [root / name for name in expected] + [root / 'HOST_TEST_REVIEW.md']
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          sums = root / 'DOWNLOADS_SHA256SUMS.txt'
          sums.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          files.append(sums)
          base = 'https://api.github.com/repos/SiteSeeAI/SiteSee-Real-Estate-Web-App'
          release_url = base + '/releases/406255227'
          def api(url, method='GET', obj=None, data=None, content_type='application/json'):
              if obj is not None: data = json.dumps(obj).encode()
              headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                         'Content-Type': content_type, 'User-Agent': 'SiteSee-reviewed-TEST-downloads', 'X-GitHub-Api-Version': '2022-11-28'}
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
          release = api(release_url)
          assert release['tag_name'] == 'unified-test-d380d41a0903'
          assert release['target_commitish'] == 'd380d41a090342d82255906f73fad518d722020d'
          assert release['prerelease'] is True
          assets = {a['name']: a for a in release['assets']}
          for path in files:
              data = path.read_bytes(); digest = hashlib.sha256(data).hexdigest()
              asset = assets.get(path.name)
              if asset is None:
                  assert release['draft'] is True, 'Do not add files to an already published candidate.'
                  url = release['upload_url'].split('{', 1)[0] + '?' + urllib.parse.urlencode({'name': path.name})
                  asset = api(url, 'POST', data=data, content_type='application/octet-stream')
              assert asset['state'] == 'uploaded' and asset['size'] == len(data)
              assert asset.get('digest') == 'sha256:' + digest
              print(path.name + ': exact SHA-256 verified; uploaded')
          release = api(release_url)
          assert set(a['name'] for a in release['assets']) == set(p.name for p in files)
          if release['draft']:
              release = api(release_url, 'PATCH', obj={'draft': False, 'prerelease': True, 'make_latest': 'false'})
          assert release['draft'] is False and release['prerelease'] is True
          print('Published reviewed TEST download assets: ' + release['html_url'])
