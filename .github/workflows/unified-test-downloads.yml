name: Publish reviewed appointment TEST downloads
on:
  push:
    branches: ['feat/unified-test-downloads-2de1135']
    paths: ['.github/workflows/unified-test-downloads.yml']
permissions:
  contents: write
  actions: read
jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 2de113503050b4ca5a63ad0aaa1b14705a3726e0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact reviewed candidate
        run: |
          python3 tools/build-unified-release.py --commit 2de113503050b4ca5a63ad0aaa1b14705a3726e0 --output "$RUNNER_TEMP/unified-test-downloads"
          git show 2de113503050b4ca5a63ad0aaa1b14705a3726e0:tools/install-appointment-approval-host.py > "$RUNNER_TEMP/unified-test-downloads/install-appointment-approval-host.py"
      - name: Require exact-source CI and verify download hashes before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, json, hashlib, urllib.request, urllib.parse, base64, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'unified-test-downloads'
          expected = {'unified-test-2de113503050.tar.gz': 'ad2a2a0cb773800a114b732ea74f1d2166a82e70e9c34bf4840a8dbc5aaae1ad', 'install-unified.py': '3b65eb5117e22098359164de1432ffe46a728e2f68a38e432dc6d031402379f4', 'install-appointment-approval-host.py': 'b7337911e4215e8406303859052d03cff82fef428687d2f6a59ed54d191da1d0', 'HOST_TEST_REVIEW.md': '879c45ac732231ce8baef0ff062fe02ea330274ded0f1b96f3ac71d6ec266096'}
          commit = '2de113503050b4ca5a63ad0aaa1b14705a3726e0'
          release_url = 'https://api.github.com/repos/SiteSeeAI/SiteSee-Real-Estate-Web-App/releases/407201889'
          (root / 'HOST_TEST_REVIEW.md').write_bytes(base64.b64decode(''))
          files = [root / name for name in expected]
          for path in files:
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[path.name], path.name + ' checksum differs'
          (root / 'DOWNLOADS_SHA256SUMS.txt').write_text(''.join(expected[p.name] + '  ' + p.name + '\n' for p in files))
          files.append(root / 'DOWNLOADS_SHA256SUMS.txt')
          def api(url, method='GET', obj=None, data=None, content_type='application/json'):
              if obj is not None: data = json.dumps(obj).encode()
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': content_type, 'User-Agent': 'SiteSee-reviewed-TEST-downloads', 'X-GitHub-Api-Version': '2022-11-28'}
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
          for attempt in range(90):
              runs = api('https://api.github.com/repos/SiteSeeAI/SiteSee-Real-Estate-Web-App/actions/runs?branch=feat/unified-server-app-20261007&per_page=100')['workflow_runs']
              selected = {r['name']: r for r in runs if r['head_sha'] == commit}
              required = ['Unified Release Checks', 'Server Form CI']
              if all(name in selected and selected[name]['status'] == 'completed' for name in required):
                  assert all(selected[name]['conclusion'] == 'success' for name in required), 'Exact-source CI did not pass'
                  break
              time.sleep(10)
          else: raise RuntimeError('Exact-source CI not complete; no download publication')
          release = api(release_url)
          assert release['tag_name'] == 'unified-test-2de113503050' and release['target_commitish'] == commit and release['prerelease'] is True
          assets = {a['name']: a for a in release['assets']}
          for path in files:
              data = path.read_bytes(); digest = hashlib.sha256(data).hexdigest()
              asset = assets.get(path.name)
              if asset is None:
                  assert release['draft'] is True, 'Do not add files to an already published candidate'
                  url = release['upload_url'].split('{', 1)[0] + '?' + urllib.parse.urlencode({'name': path.name})
                  asset = api(url, 'POST', data=data, content_type='application/octet-stream')
              assert asset['state'] == 'uploaded' and asset['size'] == len(data)
              assert asset.get('digest') == 'sha256:' + digest
              print(path.name + ': exact SHA256 verified and uploaded')
          release = api(release_url)
          assert set(a['name'] for a in release['assets']) == set(p.name for p in files)
          if release['draft']:
              release = api(release_url, 'PATCH', obj={'draft': False, 'prerelease': True, 'make_latest': 'false'})
          assert release['draft'] is False and release['prerelease'] is True
          print('Published reviewed TEST downloads: ' + release['html_url'])
