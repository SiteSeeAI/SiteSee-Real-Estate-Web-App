name: Customer Portal Checks

on:
  pull_request:
    paths:
      - '_private/server/portal-*.php'
      - '_private/server/booking-*.php'
      - '_private/views/portal*.php'
      - 'public/account.php'
      - 'public/portal-assets/**'
      - 'tests/fixtures/portal-http/**'
      - 'tests/fixtures/staff-http/**'
      - 'tests/fixtures/portal-r1/**'
      - 'documents/portal/**'
      - 'tests/portal-*'
      - 'tools/*portal*'
      - 'tools/*re-business*'
      - 'tools/*re-draft*'
      - 'tools/*staff-review*'
      - '.github/workflows/customer-portal-ci.yml'
  push:
    branches: ['feat/calendar-confirmation-20260925']
    paths:
      - '_private/server/portal-*.php'
      - '_private/server/booking-*.php'
      - '_private/views/portal*.php'
      - 'public/account.php'
      - 'public/portal-assets/**'
      - 'tests/fixtures/portal-http/**'
      - 'tests/fixtures/staff-http/**'
      - 'tests/fixtures/portal-r1/**'
      - 'documents/portal/**'
      - 'tests/portal-*'
      - 'tools/*portal*'
      - 'tools/*re-business*'
      - 'tools/*re-draft*'
      - 'tools/*staff-review*'
      - '.github/workflows/customer-portal-ci.yml'

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Validate private account primitives
        run: |
          find _private/server -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l _private/views/portal.php
          php -l _private/views/portal-purchase.php
          php -l _private/views/portal-service.php
          php -l _private/server/booking-webhook.php
          php -l public/account.php
          php tests/portal-access.test.php
          php tests/portal-session.test.php
          php tests/portal-purchase.test.php
          php tests/portal-service.test.php
          php tests/portal-draft-recovery.test.php
          php tests/portal-release.test.php
          php tests/portal-phone.test.php
          php tests/portal-sms.test.php
          php -l tools/portal-enroll-phone.php
          python3 tests/portal-installer.test.py
          python3 tests/portal-complete.test.py
          python3 tests/portal-re-enrollment.test.py
          python3 tests/portal-re-workflow.test.py
          python3 tests/portal-draft-installer.test.py
          python3 tests/portal-polish-installer.test.py
          python3 tests/portal-staff-installer.test.py
          python3 tests/portal-staff-source.test.py
          python3 tools/build-portal-installer.py
          git diff --exit-code -- tools/install-customer-portal.py
          python3 tools/build-portal-complete.py
          git diff --exit-code -- tools/install-portal-complete.py
          python3 tools/build-re-draft-recovery.py
          git diff --exit-code -- tools/install-re-draft-recovery-r1.py
          python3 tools/build-re-business-workflow.py
          git diff --exit-code -- tools/install-re-business-workflow.py
          python3 tools/build-portal-polish.py
          git diff --exit-code -- tools/install-re-portal-polish-20261002-r1.py
          python3 tools/build-staff-review.py
          git diff --exit-code -- tools/install-re-staff-review-20261002-r1.py
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-browser" --no-save playwright@1.58.2
          "$RUNNER_TEMP/portal-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Check preview interactions and responsive layout
        env:
          NODE_PATH: ${{ runner.temp }}/portal-browser/node_modules
          PORTAL_SCREENSHOTS: ${{ runner.temp }}/portal-screenshots
        run: |
          mkdir -p "$PORTAL_SCREENSHOTS"
          node tests/portal-preview.browser.cjs
          node tests/portal-http.browser.cjs
          node tests/portal-staff.browser.cjs
      - name: Save example-only preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-portal-preview
          path: ${{ runner.temp }}/portal-screenshots
          if-no-files-found: ignore
          retention-days: 7
