name: Publish reviewed LIVE-001 downloads
on:
  push:
    branches: ['feat/live-downloads-fe96eba']
    paths: ['.github/workflows/live-downloads.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 'fe96ebabe207d0ab9f712939385a6aa26e7109ac'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact-source gates and publish immutable downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, time, urllib.request, urllib.error, urllib.parse, zipfile
          
          SOURCE = 'fe96ebabe207d0ab9f712939385a6aa26e7109ac'
          TAG = 'unified-test-fe96ebabe207'
          REPO = 'SiteSeeAI/SiteSee-Real-Estate-Web-App'
          BASE = 'https://api.github.com/repos/' + REPO
          EXPECTED = {'unified-test-fe96ebabe207.tar.gz': 'dd78302ee8b35333d9a32ab9a161438c41b278931e438ca58d3753dedc5006f3', 'HOST_LIVE_REVIEW.md': '312567034fe6ee7311021e7cffed64a79a7f5ada3075c10e67152ab1d50e1dbd', 'install-appointment-approval-host.py': 'b44e777737268a3201ea84940bc4469142cc96c1a3fd139ce3a5d21329f220c1', 'install-unified.py': '87692538eca9e197d772b64cba616612215636e147f73ceae4f01371e7fdd347', 'prepare-live.py': '8e1e3d6fd698275147703add4ef5d5605671f02145773f642c3814240902a9fb', 'INSTALL_CODE.sh': 'c5f70f8041a7083edfbf73ed8ebdfeb054bf3da7e1a3328e091e3fdce385d2ed'}
          EXTRA = {'HOST_LIVE_REVIEW.md': '', 'INSTALL_CODE.sh': ''}
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-live-downloads'
          
          def api(url, method='GET', obj=None, data=None):
              if obj is not None: data=json.dumps(obj).encode()
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28','User-Agent':'SiteSee-reviewed-LIVE-preparation',
                       'Content-Type':'application/json' if obj is not None else 'application/octet-stream'}
              with urllib.request.urlopen(urllib.request.Request(url,method=method,headers=headers,data=data),timeout=120) as response:
                  return json.load(response)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def log_archive(run_id):
              # GitHub's log API needs actions:read even for public repositories. Never
              # forward that authorization header to the signed storage redirect.
              url=BASE+'/actions/runs/'+str(run_id)+'/logs'
              request=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','User-Agent':'SiteSee-exact-release-validation'})
              opener=urllib.request.build_opener(NoRedirect())
              for attempt in range(12):
                  try:
                      try:
                          response=opener.open(request,timeout=120)
                      except urllib.error.HTTPError as error:
                          if error.code not in [301,302,303,307,308]:raise
                          target=error.headers['Location']
                          parsed=urllib.parse.urlsplit(target)
                          assert parsed.scheme=='https' and parsed.username is None and parsed.password is None
                          assert parsed.hostname and (parsed.hostname.endswith('.blob.core.windows.net') or parsed.hostname.endswith('.actions.githubusercontent.com'))
                          response=urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'SiteSee-exact-release-validation'}),timeout=120)
                      with response:data=response.read(33554433)
                      assert len(data)<=33554432
                      return data
                  except urllib.error.HTTPError as error:
                      if error.code not in [404,409,429,500,502,503,504] or attempt==11:raise
                      time.sleep(5)
          
          required=['Server Form CI','Customer Portal Checks','Appointment Host Checks','Unified Release Checks']
          for attempt in range(180):
              runs=api(BASE+'/actions/runs?branch=feat/unified-server-app-20261007&per_page=100')['workflow_runs']
              selected={r['name']:r for r in runs if r['head_sha']==SOURCE and r['name'] in required}
              failed=[name for name,r in selected.items() if r['status']=='completed' and r['conclusion']!='success']
              assert not failed,'Exact-source checks failed: '+str(failed)
              if set(selected)==set(required) and all(r['status']=='completed' for r in selected.values()):break
              if attempt%6==0:print('Waiting for exact-source release gates; no downloads published.',flush=True)
              time.sleep(10)
          else:raise RuntimeError('Exact-source CI not complete; draft preserved.')
          
          proof=[]; logs={}
          for name in required:
              run=selected[name]
              jobs=api(BASE+'/actions/runs/'+str(run['id'])+'/jobs?per_page=100')['jobs']
              assert jobs and all(j['conclusion']=='success' for j in jobs)
              assert all(s['conclusion'] in ['success','skipped'] for j in jobs for s in j['steps'])
              # gh's formatted log output truncates very long screenshot lines and can
              # omit later completion markers. Inspect the complete public log archive.
              data=log_archive(run['id'])
              with zipfile.ZipFile(io.BytesIO(data)) as zipped:
                  logs[name]='\n'.join(zipped.read(n).decode(errors='replace') for n in zipped.namelist())
              proof.append({'workflow':name,'id':run['id'],'url':run['html_url'],'conclusion':run['conclusion'],
                            'log_archive_sha256':hashlib.sha256(data).hexdigest(),
                            'jobs':[{'id':j['id'],'name':j['name'],'conclusion':j['conclusion']} for j in jobs]})
          assert logs['Unified Release Checks'].count('Unified release: 65 cases completed; 0 privileged skips.')>=2
          assert 'Ran 14 tests' in logs['Appointment Host Checks']
          for marker in ['portal-preview: PASS','portal-http: PASS','portal-staff: PASS','portal-job-browser: PASS',
                         'portal-vendor-browser: PASS','portal-email-browser: PASS','Calendar notice browser: PASS',
                         'booking-finance: PASS (95 assertions','booking-finance: PASS (94 assertions']:
              assert marker in logs['Customer Portal Checks'],'Missing real execution marker: '+marker
          
          subprocess.run(['python3','tools/build-unified-release.py','--commit',SOURCE,'--output',str(root)],check=True)
          for name,value in EXTRA.items():(root/name).write_bytes(base64.b64decode(value,validate=True))
          for name in ['prepare-live.py','install-appointment-approval-host.py']:
              (root/name).write_bytes(pathlib.Path('tools',name).read_bytes())
          for name,digest in EXPECTED.items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name+' differs'
          validation={'source':SOURCE,'release':TAG,'deployment_files':285,'runtime_modes':['TEST','LIVE'],
                      'default_runtime_mode':'TEST','workflows':proof,'privileged_release_cases_per_php':65,
                      'privileged_release_skips':0,'actual_fpm_cases':14,'host_cases':27,'live_runtime_cases':18,
                      'preparation_cases':9,'deployment_mode_cases':13,'test_finance_assertions':95,
                      'synthetic_live_finance_assertions':94,'browser_suites':7,'host_installation':False,
                      'live_activation':False,'provider_operations':'none during local/release validation',
                      'cleanup':'paused','CTC':'excluded from access'}
          (root/'LIVE_VALIDATION.json').write_text(json.dumps(validation,indent=2)+'\n')
          files=[root/name for name in sorted(EXPECTED)]+[root/'LIVE_VALIDATION.json']
          (root/'DOWNLOADS_SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          files.append(root/'DOWNLOADS_SHA256SUMS.txt')
          release=api(BASE+'/releases/414033393')
          assert release['target_commitish']==SOURCE and release['tag_name']==TAG and release['prerelease'] is True
          assert release['draft'] is True,'Only the reviewed draft may receive assets.'
          assets={a['name']:a for a in release['assets']}
          assert set(assets)<=set(p.name for p in files),'Unknown draft assets preserved'
          for path in files:
              data=path.read_bytes();digest=hashlib.sha256(data).hexdigest();asset=assets.get(path.name)
              if asset is None:
                  asset=api(release['upload_url'].split('{')[0]+'?'+urllib.parse.urlencode({'name':path.name}),'POST',data=data)
              assert asset['state']=='uploaded' and asset['size']==len(data) and asset.get('digest')=='sha256:'+digest
              print(path.name+': exact SHA256 verified and uploaded',flush=True)
          release=api(BASE+'/releases/'+str(release['id']))
          assert set(a['name'] for a in release['assets'])==set(p.name for p in files)
          published=api(BASE+'/releases/'+str(release['id']),'PATCH',obj={'draft':False,'make_latest':'false'})
          assert published['draft'] is False and published['tag_name']==TAG
          print('Published exact reviewed downloads: '+published['html_url'],flush=True)
          PY
