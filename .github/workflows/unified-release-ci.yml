name: Unified Release Checks
on:
  pull_request:
    paths:
      - '_private/**'
      - 'public/**'
      - 'tools/build-unified-release.py'
      - 'tools/install-unified.py'
      - 'tools/install-appointment-approval-host.py'
      - 'tests/appointment-approval-host.test.py'
      - 'tests/unified-release.test.py'
      - 'tests/deployment-mode.test.py'
      - 'tests/mode-source.test.py'
      - 'tests/live_runtime_test.py'
      - 'tests/prepare_live_test.py'
      - 'tests/support/live-mode.php'
      - 'tools/prepare-live.py'
      - 'tests/booking_crm_recovery_test.py'
      - 'tests/fixtures/booking-crm-before/**'
      - 'documents/unified/**'
      - '.github/workflows/unified-release-ci.yml'
  push:
    branches: ['feat/unified-*']
    paths:
      - '_private/**'
      - 'public/**'
      - 'tools/build-unified-release.py'
      - 'tools/install-unified.py'
      - 'tools/install-appointment-approval-host.py'
      - 'tests/appointment-approval-host.test.py'
      - 'tests/unified-release.test.py'
      - 'tests/deployment-mode.test.py'
      - 'tests/mode-source.test.py'
      - 'tests/live_runtime_test.py'
      - 'tests/prepare_live_test.py'
      - 'tests/support/live-mode.php'
      - 'tools/prepare-live.py'
      - 'tests/booking_crm_recovery_test.py'
      - 'tests/fixtures/booking-crm-before/**'
      - 'documents/unified/**'
      - '.github/workflows/unified-release-ci.yml'
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, curl, openssl
      - name: Check host protocol, drain and failed traffic reopening
        run: python3 tests/appointment-approval-host.test.py
      - name: Verify synthetic LIVE financial and activation boundaries
        run: |
          python3 tests/deployment-mode.test.py
          python3 tests/mode-source.test.py
          php -d disable_functions=curl_exec tests/booking-finance.test.php --live
          python3 -m unittest discover -s tests -p live_runtime_test.py
          python3 -m unittest discover -s tests -p prepare_live_test.py
      - name: Rehearse release and every interrupted replacement
        run: python3 tests/unified-release.test.py
      - name: Require real privileged ownership checks without skips
        run: sudo env PATH="$PATH" SITESEE_REQUIRE_PRIVILEGED_TESTS=1 python3 tests/unified-release.test.py
