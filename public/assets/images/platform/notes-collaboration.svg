<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Spatial notes and team review</title>
  <desc id="desc">Simplified illustrative SiteSee workspace with a floor plan, three numbered location pins and matching notes showing owners and review status.</desc>
  <defs>
    <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#061825"/><stop offset="1" stop-color="#122b3b"/></linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#navy)"/>
  <path d="M34 27h18v18H34zM45 37h18v18H45z" fill="none" stroke="#ffc52a" stroke-width="5" stroke-linejoin="round"/>
  <text x="82" y="50" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">SiteSee</text>
  <path d="M208 22v38" stroke="#66808b"/>
  <text x="233" y="49" fill="#dce5e9" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">SPATIAL REVIEW WORKSPACE</text>
  <text x="1156" y="49" text-anchor="end" fill="#ffc52a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1">PROPERTY NOTES</text>

  <rect x="28" y="78" width="742" height="500" rx="9" fill="#fff"/>
  <text x="52" y="112" fill="#172b38" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">LEVEL 01 / PROPERTY PLAN</text>
  <path d="M45 128h707" stroke="#d6dcdf" stroke-width="2"/>
  <!-- A deliberately simple plan keeps the location pins legible at card size. -->
  <g fill="none" stroke="#445057" stroke-width="6" stroke-linejoin="round">
    <path d="M91 160h554v331H91z"/>
    <path d="M91 301h554M248 160v141M440 160v141M327 301v190M518 301v190"/>
    <path d="M91 428h236M440 428h205"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="10">
    <path d="M185 301h43M304 301h45M482 301h46M327 353v45M518 353v45M215 428h48M552 428h48"/>
  </g>
  <g fill="none" stroke="#89969a" stroke-width="2">
    <path d="M185 301a43 43 0 0 1 43-43M304 301a45 45 0 0 0 45-45M482 301a46 46 0 0 1 46 46M327 353a45 45 0 0 1 45 45M518 353a45 45 0 0 0-45 45"/>
  </g>
  <g fill="#46545a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="170" y="228">ENTRY</text>
    <text x="341" y="228">MAIN SPACE</text>
    <text x="548" y="228">EAST WING</text>
    <text x="202" y="378">MEETING ROOM</text>
    <text x="424" y="378">LOUNGE</text>
    <text x="576" y="378">SERVICE</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="161" cy="295" r="25" fill="#fff" stroke="#ffbd21" stroke-width="6"/><text x="161" y="303" fill="#132a38">01</text>
    <circle cx="480" cy="271" r="25" fill="#fff" stroke="#53a8dc" stroke-width="6"/><text x="480" y="279" fill="#132a38">02</text>
    <circle cx="414" cy="449" r="25" fill="#fff" stroke="#40b58e" stroke-width="6"/><text x="414" y="457" fill="#132a38">03</text>
  </g>
  <rect x="51" y="518" width="320" height="39" rx="8" fill="#f2f5f5" stroke="#c8d3d6"/>
  <text x="69" y="544" fill="#52636b" font-family="Inter,Arial,sans-serif" font-size="17">Location-specific notes on the plan</text>

  <text x="798" y="107" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Decision Trail</text>
  <text x="1154" y="104" fill="#b7c9d1" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="end">3 ACTIVE ITEMS</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="792" y="126" width="379" height="137" rx="11" fill="#142e3e" stroke="#4d6370"/>
    <circle cx="827" cy="162" r="23" fill="none" stroke="#ffbd21" stroke-width="3"/>
    <text x="827" y="169" fill="#ffcd4c" font-size="19" font-weight="700" text-anchor="middle">01</text>
    <text x="865" y="154" fill="#ffc52a" font-size="16" font-weight="700">OPEN · PLANNING</text>
    <text x="865" y="187" fill="#fff" font-size="19">Confirm entrance clearance</text>
    <text x="865" y="214" fill="#fff" font-size="19">for the arrival route.</text>
    <text x="865" y="246" fill="#b8c8ce" font-size="15">Owner: Planner · Entry</text>

    <rect x="792" y="275" width="379" height="137" rx="11" fill="#142e3e" stroke="#4d6370"/>
    <circle cx="827" cy="311" r="23" fill="none" stroke="#53a8dc" stroke-width="3"/>
    <text x="827" y="318" fill="#82c5ec" font-size="19" font-weight="700" text-anchor="middle">02</text>
    <text x="865" y="303" fill="#82c5ec" font-size="16" font-weight="700">IN REVIEW · OPERATIONS</text>
    <text x="865" y="336" fill="#fff" font-size="19">Verify the equipment path</text>
    <text x="865" y="363" fill="#fff" font-size="19">through the east wing.</text>
    <text x="865" y="395" fill="#b8c8ce" font-size="15">Attachment: access plan</text>

    <rect x="792" y="424" width="379" height="137" rx="11" fill="#142e3e" stroke="#4d6370"/>
    <circle cx="827" cy="460" r="23" fill="none" stroke="#40b58e" stroke-width="3"/>
    <text x="827" y="467" fill="#70d9ae" font-size="19" font-weight="700" text-anchor="middle">03</text>
    <text x="865" y="452" fill="#70d9ae" font-size="16" font-weight="700">RESOLVED · TEAM</text>
    <text x="865" y="485" fill="#fff" font-size="19">Layout question answered</text>
    <text x="865" y="512" fill="#fff" font-size="19">and kept with the room.</text>
    <text x="865" y="544" fill="#b8c8ce" font-size="15">Owner: Team Lead · Lounge</text>
  </g>
  <path d="M28 602h1143v56H28z" fill="#0b2231" stroke="#385466"/>
  <g fill="#ffca34" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">
    <circle cx="68" cy="630" r="10" fill="none" stroke="#ffca34" stroke-width="3"/><circle cx="68" cy="630" r="3"/>
    <text x="92" y="636">LOCATION RETAINED</text>
    <path d="M431 619h18l7 8-17 18-16-18z" fill="none" stroke="#ffca34" stroke-width="3"/>
    <text x="475" y="636">EVIDENCE ATTACHED</text>
    <path d="M839 623h25M839 633h25M839 643h25" stroke="#ffca34" stroke-width="3"/>
    <text x="888" y="636">STATUS VISIBLE</text>
  </g>
  <text x="1159" y="674" text-anchor="end" fill="#b7c9d1" font-family="Inter,Arial,sans-serif" font-size="11">ILLUSTRATIVE INTERFACE</text>
</svg>
